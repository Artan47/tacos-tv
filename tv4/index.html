<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV4</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:50% 50%;background:#000;overflow:hidden}
#stage>img,#stage>video,#stage>iframe{position:absolute;left:0;top:0;width:1080px;height:1920px;border:0;margin:0;object-fit:cover;display:block}
#stage>.layer{opacity:0;transition:opacity .6s}
#stage>iframe{background:#000;pointer-events:none}
</style></head>
<body data-tv="tv4">
<div id="stage"><img id="bg" src="../media/tv4.png" alt=""></div>
<script src="../player.js?b=6"></script>
</body></html>
